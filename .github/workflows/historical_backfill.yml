name: Historical Backfill

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "起始年份，例如 2006"
        required: true
        default: "2006"
      end_year:
        description: "結束年份，例如 2026"
        required: true
        default: "2026"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: electric-finance-ratio-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Backfill official monthly history year by year
        env:
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
        run: |
          set -euo pipefail

          if ! [[ "$START_YEAR" =~ ^[0-9]{4}$ && "$END_YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "年份必須是四位數。"
            exit 1
          fi
          if (( START_YEAR < 2000 || START_YEAR > END_YEAR )); then
            echo "年份範圍不正確。"
            exit 1
          fi

          for year in $(seq "$START_YEAR" "$END_YEAR"); do
            echo "============================================================"
            echo "使用 TWSE 月歷史資料回補 $year 年"
            echo "============================================================"

            python src/backfill_history.py \
              --start-year "$year" \
              --end-year "$year" \
              --sleep 0.45

            git add data/electronics_finance_ratio.csv
            if git diff --cached --quiet; then
              echo "$year 年沒有新增或變更資料。"
            else
              git commit -m "data: backfill official monthly history $year"
              git push
            fi
          done

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Recalculate signals and rebuild website
        run: python src/update_chart.py --no-fetch

      - name: Commit rebuilt website
        run: |
          git add data docs
          if git diff --cached --quiet; then
            echo "No final website changes to commit."
          else
            git commit -m "chore: rebuild website after historical backfill"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: backfill
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
