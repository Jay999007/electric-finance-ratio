name: Daily Electric-Finance Ratio

on:
  workflow_dispatch:
    inputs:
      market:
        description: "更新市場"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - tw
          - us

  schedule:
    # 台股：台灣時間
    - cron: "35 15 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "5 16 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "35 16 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "17 17 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "37 19 * * 1-5"
      timezone: "Asia/Taipei"

    # 美股：紐約時間
    - cron: "35 17 * * 1-5"
      timezone: "America/New_York"
    - cron: "17 19 * * 1-5"
      timezone: "America/New_York"
    - cron: "37 22 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: electric-finance-ratio-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve update market
        id: market
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MARKET: ${{ inputs.market }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            selected="${MANUAL_MARKET:-all}"
          else
            case "$EVENT_SCHEDULE" in
              "35 15 * * 1-5"|"5 16 * * 1-5"|"35 16 * * 1-5"|"17 17 * * 1-5"|"37 19 * * 1-5")
                selected="tw"
                ;;
              "35 17 * * 1-5"|"17 19 * * 1-5"|"37 22 * * 1-5")
                selected="us"
                ;;
              *)
                echo "::error::無法辨識本次排程：$EVENT_SCHEDULE"
                exit 1
                ;;
            esac
          fi

          case "$selected" in
            tw|us|all) ;;
            *)
              echo "::error::不支援的 market：$selected"
              exit 1
              ;;
          esac

          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "本次更新市場：$selected"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Chinese fonts
        if: steps.market.outputs.selected == 'tw' || steps.market.outputs.selected == 'all'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Show trigger information
        shell: bash
        env:
          SELECTED_MARKET: ${{ steps.market.outputs.selected }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Schedule: ${EVENT_SCHEDULE:-manual}"
          echo "Selected market: $SELECTED_MARKET"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run attempt: ${{ github.run_attempt }}"
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Taipei time: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "New York time: $(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Fetch TWSE data and build Taiwan website
        if: steps.market.outputs.selected == 'tw' || steps.market.outputs.selected == 'all'
        shell: bash
        run: |
          set +e
          success=0

          for attempt in 1 2 3; do
            echo "=============================================="
            echo "台股更新：第 ${attempt}/3 次"
            echo "台北時間：$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
            echo "=============================================="

            python src/update_chart.py --retry-rounds 3
            exit_code=$?

            if [ "$exit_code" -eq 0 ]; then
              echo "台股資料更新成功。"
              success=1
              break
            fi

            echo "台股資料更新失敗，exit code=${exit_code}"

            if [ "$attempt" -lt 3 ]; then
              echo "等待 5 分鐘後重新執行。"
              sleep 300
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "::error::台股更新連續 3 次失敗。"
            exit 1
          fi

      - name: Re-append existing US chart after Taiwan rebuild
        if: steps.market.outputs.selected == 'tw'
        shell: bash
        run: |
          set -euo pipefail
          python src/update_us_ratio.py --no-fetch

      - name: Fetch US adjusted data and append US ratio chart
        if: steps.market.outputs.selected == 'us' || steps.market.outputs.selected == 'all'
        shell: bash
        run: |
          set +e
          success=0

          for attempt in 1 2 3; do
            echo "=============================================="
            echo "美股更新：第 ${attempt}/3 次"
            echo "紐約時間：$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S')"
            echo "=============================================="

            python src/update_us_ratio.py
            exit_code=$?

            if [ "$exit_code" -eq 0 ]; then
              echo "美股資料更新成功。"
              success=1
              break
            fi

            echo "美股資料更新失敗，exit code=${exit_code}"

            if [ "$attempt" -lt 3 ]; then
              echo "等待 5 分鐘後重新執行。"
              sleep 300
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "::error::美股更新連續 3 次失敗。"
            exit 1
          fi

      - name: Show latest data dates
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          files = [
              ("台股", Path("data/electronics_finance_ratio.csv")),
              ("美股", Path("data/us_technology_finance_ratio.csv")),
          ]

          for label, path in files:
              if not path.exists():
                  print(f"{label}：找不到 {path}")
                  continue

              try:
                  frame = pd.read_csv(path)
                  if frame.empty or "date" not in frame.columns:
                      print(f"{label}：CSV 無有效 date")
                      continue
                  latest = pd.to_datetime(frame["date"], errors="coerce").max()
                  print(f"{label}最新資料日期：{latest.date() if pd.notna(latest) else '無法判讀'}")
              except Exception as exc:
                  print(f"{label}日期檢查失敗：{exc}")
          PY

      - name: Check for data changes
        id: changes
        shell: bash
        run: |
          git add data docs

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "資料與網頁沒有變化，不需要 commit。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "偵測到資料或網頁內容變更。"
            echo
            echo "變更檔案："
            git diff --cached --name-status
          fi

      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          SELECTED_MARKET: ${{ steps.market.outputs.selected }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update ${SELECTED_MARKET} electric-finance ratio"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
